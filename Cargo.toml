[package]
name = "glacier"
version = "0.2.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
url = "2"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5.2", features = ["json"] }
urlencoding = "2"
x11rb = { version = "0.13.2", features = ["shape"] }
zbus = "5"

[profile.dev]
debug = 0
incremental = true

[profile.release]
opt-level = 2
panic = "abort"
strip = true
